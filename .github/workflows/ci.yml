name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build, test (PostgreSQL via Testcontainers) and enforce 80% coverage
        run: ./mvnw -B verify

      - name: Static security analysis (SpotBugs + FindSecBugs)
        run: ./mvnw -B spotbugs:check

      - name: Build container image
        run: docker build -t snappark:${{ github.sha }} .

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco/

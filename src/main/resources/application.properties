spring.application.name=snappark

# Database: PostgreSQL, configured from the environment (see docker-compose.yml)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/snappark}
spring.datasource.username=${DB_USER:snappark}
spring.datasource.password=${DB_PASSWORD:snappark}
# Flyway owns the schema; Hibernate only checks that the entities still match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.threads.virtual.enabled=true
spring.mvc.problemdetails.enabled=true
server.shutdown=graceful

# Operations: liveness/readiness probes for the orchestrator, Prometheus metrics for monitoring
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}

# Booking rules
snappark.hold-ttl=PT5M
snappark.grace-period=PT5M
snappark.zone=Asia/Kolkata
snappark.sweep-interval=PT30S

# Operator account. No hash configured means no admin account exists (admin API locked).
snappark.admin.username=${ADMIN_USERNAME:admin}
snappark.admin.password-hash=${ADMIN_PASSWORD_HASH:}
